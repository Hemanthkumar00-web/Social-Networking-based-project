<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent - Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .sent-container { width: 388px; }
        .sent-box {
            background-color: #000;
            border: 1px solid #363636;
            border-radius: 1px;
            padding: 40px;
            text-align: center;
        }
        .check-icon {
            width: 96px;
            height: 96px;
            border: 3px solid #4caf50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .sent-box h2 {
            font-size: 18px;
            font-weight: 600;
            color: #f5f5f5;
            margin-bottom: 12px;
        }
        .sent-box p {
            font-size: 14px;
            color: #a8a8a8;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .sent-box .hint {
            font-size: 12px;
            color: #b0b0b0;
            margin-top: 12px;
            padding: 12px;
            background: #121212;
            border-radius: 8px;
            line-height: 1.5;
        }
        .back-btn {
            display: inline-block;
            padding: 8px 24px;
            margin-top: 20px;
            background-color: #0095f6;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .back-btn:hover { background-color: #1877f2; }
    </style>
</head>
<body>
    <div class="sent-container">
        <div class="sent-box">
            <div class="check-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4caf50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </div>
            <h2>Email sent</h2>
            <p>We've sent a password reset link to your email address. Please check your inbox and click the link to reset your password.</p>
            <div class="hint">
                Since this is a development server, the reset link is printed in the terminal/console where the Django server is running.
            </div>
            <a href="{% url 'login' %}" class="back-btn">Back to login</a>
        </div>
    </div>
</body>
</html>
