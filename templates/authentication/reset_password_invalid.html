<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invalid Link - Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .invalid-container { width: 388px; }
        .invalid-box {
            background-color: #000;
            border: 1px solid #363636;
            border-radius: 1px;
            padding: 40px;
            text-align: center;
        }
        .error-icon {
            width: 96px;
            height: 96px;
            border: 3px solid #ed4956;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .invalid-box h2 {
            font-size: 18px;
            font-weight: 600;
            color: #f5f5f5;
            margin-bottom: 12px;
        }
        .invalid-box p {
            font-size: 14px;
            color: #a8a8a8;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .retry-btn {
            display: inline-block;
            padding: 8px 24px;
            background-color: #0095f6;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s;
            margin-bottom: 12px;
        }
        .retry-btn:hover { background-color: #1877f2; }
        .back-link {
            display: block;
            margin-top: 12px;
            font-size: 14px;
            color: #0095f6;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="invalid-container">
        <div class="invalid-box">
            <div class="error-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ed4956" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </div>
            <h2>Reset link is invalid</h2>
            <p>The password reset link has expired or has already been used. Please request a new one.</p>
            <a href="{% url 'forgot_password' %}" class="retry-btn">Request new link</a>
            <a href="{% url 'login' %}" class="back-link">Back to login</a>
        </div>
    </div>
</body>
</html>
