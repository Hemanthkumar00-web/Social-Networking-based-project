{% extends 'base.html' %}

{% block title %}New Message - Instagram{% endblock %}

{% block content %}
<div class="main-container" style="padding-top:24px;">
    <div class="modal-box" style="margin:0 auto;">
        <div class="modal-header">
            <a href="{% url 'messages_inbox' %}" class="dm-back-btn" title="Back" style="margin-right:8px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </a>
            <span>New Message</span>
            <a href="{% url 'messages_inbox' %}" class="modal-close">&times;</a>
        </div>
        <div class="modal-body">
            {% if error %}
            <div class="alert alert-error" style="margin-bottom:16px;">{{ error }}</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>To (username)</label>
                    <input type="text" name="username" placeholder="Enter username..." required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea name="body" placeholder="Type a message..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">Send</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
